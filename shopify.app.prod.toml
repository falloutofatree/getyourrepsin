# Production app config — Sales Reps Portal
# This is for the production Shopify app (separate from dev)

client_id = "0b8e2e20655ad30a496987c415aa905e"
name = "Sales Reps Portal"
application_url = "https://sales-rep-portal-9lckt.ondigitalocean.app"
embedded = true

[build]

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "company_locations/create" ]
  uri = "/webhooks/company_locations/create"

[access_scopes]
scopes = "read_products,write_products,read_product_listings,read_publications,read_companies,write_companies,read_customers,write_customers,write_draft_orders,read_draft_orders,read_orders,read_markets"

[auth]
redirect_urls = [
  "https://sales-rep-portal-9lckt.ondigitalocean.app/auth/callback",
  "https://sales-rep-portal-9lckt.ondigitalocean.app/auth/shopify/callback",
  "https://sales-rep-portal-9lckt.ondigitalocean.app/api/auth/callback"
]
